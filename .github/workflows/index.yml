name: index
# 5-minute runner for the US-index rule on the SECOND practice account. Triggered by cron-job.org (workflow_dispatch). INDEX_TRADING must be 'true' to place orders; otherwise it only logs.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python index_run.py
        env:
          OANDA_API_TOKEN_INDEX: ${{ secrets.OANDA_API_TOKEN_INDEX }}
          OANDA_ACCOUNT_ID_INDEX: ${{ secrets.OANDA_ACCOUNT_ID_INDEX }}
          INDEX_TRADING: ${{ vars.INDEX_TRADING }}
          INDEX_COMPOUND: ${{ vars.INDEX_COMPOUND || 'true' }}     # ON from 23 Nov 2026 (the PM); set the repo variable to 'false' to turn off
          INDEX_COMPOUND_START: ${{ vars.INDEX_COMPOUND_START || '2026-11-18T00:00:00Z' }}     # counts every BFG trade closed since live trading began, so the base matches the account balance
      - id: commit
        run: |
          git config user.name "gbpusd-agent"
          git config user.email "agent@users.noreply.github.com"
          git add -A logs
          if ! git diff --cached --quiet; then
            git commit -m "index run $(date -u +%FT%TZ)"
            echo "changed=true" >> "$GITHUB_OUTPUT"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 4; done
          fi
      - name: Trigger the demo mirror only when this run logged something new (does nothing unless both the secret and the variable are set)
        if: always() && steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MIRROR_DISPATCH_TOKEN }}
          MIRROR_REPO: ${{ vars.MIRROR_REPO }}
        run: |
          if [ -n "$GH_TOKEN" ] && [ -n "$MIRROR_REPO" ]; then
            gh api -X POST "repos/$MIRROR_REPO/actions/workflows/ctrader-mirror.yml/dispatches" -f ref=main -f 'inputs[mode]=mirror'
          fi
