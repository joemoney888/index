name: databento
# One cost-capped pull of CME NQ 10-level order book data from Databento using PREPAID CREDIT, reduced to one-second samples, then the imbalance test. Reads only; places NO orders.
# Needs the repository secret DATABENTO_API_KEY. The job stops before downloading if the quoted cost is above max_usd.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start, e.g. 2026-11-18T14:30"
        default: "2026-11-18T14:30"
      end:
        description: "UTC end, e.g. 2026-11-18T21:00"
        default: "2026-11-18T21:00"
      max_usd:
        description: "stop if the quoted cost is above this"
        default: "10"
permissions:
  contents: write
concurrency:
  group: databento
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install databento pandas numpy
      - run: python databento_pull.py
        env:
          DATABENTO_API_KEY: ${{ secrets.DATABENTO_API_KEY }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MAX_USD: ${{ inputs.max_usd }}
      - run: DIR=depth/nq OUT=depth/NQ_REPORT.md LABEL="CME NQ futures (Databento)" python itch_analyze.py
      - run: |
          git config user.name "gbpusd-agent"
          git config user.email "agent@users.noreply.github.com"
          git add depth/nq depth/NQ_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "NQ depth sample and report"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
          fi
