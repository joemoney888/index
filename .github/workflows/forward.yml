name: forward
# Nightly forward paper test of the NAS100 rule that passed the exam (replay on fresh bars; no orders). Lives in this public repo (unlimited Actions minutes). Reads prices only.
on:
  workflow_dispatch:
  schedule:
    - cron: "40 22 * * 1-5"
permissions:
  contents: write
concurrency:
  group: forward
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python forward_shadow.py
        env:
          OANDA_API_TOKEN_INDEX: ${{ secrets.OANDA_API_TOKEN_INDEX }}
          OANDA_ACCOUNT_ID_INDEX: ${{ secrets.OANDA_ACCOUNT_ID_INDEX }}
      - run: |
          git config user.name "gbpusd-agent"
          git config user.email "agent@users.noreply.github.com"
          git add forward
          if ! git diff --cached --quiet; then
            git commit -m "forward shadow $(date -u +%FT%TZ)"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
          fi
