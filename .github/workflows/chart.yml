name: chart
# Blue Falcon Green: draws the day's trades on charts and writes a TradingView Pine Script. Reads only; places NO orders.
on:
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day YYYY-MM-DD (default today)"
        default: ""
  schedule:
    - cron: "15 21 * * 1-5"
permissions:
  contents: write
concurrency:
  group: chart
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib
      - run: python index_chart.py
        env:
          DAY: ${{ inputs.day }}
          OANDA_API_TOKEN_INDEX: ${{ secrets.OANDA_API_TOKEN_INDEX }}
          OANDA_ACCOUNT_ID_INDEX: ${{ secrets.OANDA_ACCOUNT_ID_INDEX }}
      - run: |
          git config user.name "gbpusd-agent"
          git config user.email "agent@users.noreply.github.com"
          git add charts
          if ! git diff --cached --quiet; then
            git commit -m "charts $(date -u +%FT%TZ)"
            for i in 1 2 3 4 5; do git pull --rebase && git push && break || sleep 5; done
          fi
